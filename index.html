<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon — Suivi Quotidien</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  
  <!-- En-tête -->
  <header class="app-header">
    <div class="brand">
      <h1>Horizon</h1>
      <span class="badge-bornes" id="bornesBadge">0 bornes</span>
    </div>
    <button id="menuBtn" class="btn-icon" title="Configuration GitHub">⚙️</button>
  </header>

  <!-- Saisie de la valeur du jour -->
  <section class="card">
    <h2>Valeur du jour</h2>
    <form id="entryForm" class="inline-form">
      <input type="number" step="any" id="valueInput" placeholder="Ex: 75.5..." required>
      <button type="submit" class="btn btn-primary">Noter</button>
    </form>
  </section>

  <!-- Système de To-Do récurrent (Gains de bornes) -->
  <section class="card">
    <div class="card-header-row">
      <h2>Routine quotidienne</h2>
      <span class="sub-text" id="todoProgressText">0 / 0</span>
    </div>
    <ul id="todoList" class="todo-list"></ul>
    <form id="todoForm" class="inline-form" style="margin-top: 10px;">
      <input type="text" id="todoInput" placeholder="Nouvelle habitude / tâche récurrente..." maxlength="50" required>
      <button type="submit" class="btn btn-secondary">+</button>
    </form>
  </section>

  <!-- Heatmap style GitHub (Activité) -->
  <section class="card">
    <h2>Activité annuelle</h2>
    <div class="heatmap-container">
      <div id="heatmap" class="heatmap"></div>
    </div>
    <div class="heatmap-legend">
      <span>Moins</span>
      <div class="heat-box level-0"></div>
      <div class="heat-box level-1"></div>
      <div class="heat-box level-2"></div>
      <div class="heat-box level-3"></div>
      <div class="heat-box level-4"></div>
      <span>Plus</span>
    </div>
  </section>

  <!-- Historique des valeurs -->
  <section class="card">
    <h2>Historique des entrées</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Valeur</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

  <!-- Footer Sync GitHub -->
  <footer class="app-footer">
    <button id="syncPushBtn" class="btn btn-success">☁️ Push GitHub</button>
    <button id="syncPullBtn" class="btn btn-secondary">📥 Pull GitHub</button>
  </footer>

</div>

<!-- Modal Configuration GitHub -->
<div id="configModal" class="modal">
  <div class="modal-content">
    <h3>Configuration GitHub</h3>
    <label>Dépôt (ex: gregorryy/horizon)</label>
    <input type="text" id="ghRepo" placeholder="utilisateur/repo">
    <label>Token d'accès personnel (PAT)</label>
    <input type="password" id="ghToken" placeholder="ghp_...">
    <div class="modal-actions">
      <button id="configSave" class="btn btn-primary">Enregistrer</button>
      <button id="configClose" class="btn btn-secondary">Fermer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
