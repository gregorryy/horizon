<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon — Suivi GitHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  
  <header class="app-header">
    <h1>Horizon</h1>
    <button id="menuBtn" class="btn-icon" title="Configuration GitHub">⚙️</button>
  </header>

  <!-- Saisie du jour -->
  <section class="card">
    <h2>Aujourd'hui</h2>
    <form id="entryForm" class="inline-form">
      <input type="number" step="any" id="valueInput" placeholder="Valeur du jour..." required>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
  </section>

  <!-- Heatmap style GitHub -->
  <section class="card">
    <h2>Activité annuelle</h2>
    <div class="heatmap-container">
      <div id="heatmap" class="heatmap"></div>
    </div>
  </section>

  <!-- Statistiques et Historique -->
  <section class="card">
    <h2>Historique & Valeurs</h2>
    <div class="table-responsive">
      <table id="historyTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Valeur</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>

  <!-- Footer Sync -->
  <footer class="app-footer">
    <button id="syncPushBtn" class="btn btn-success">☁️ Push GitHub</button>
    <button id="syncPullBtn" class="btn btn-secondary">📥 Pull GitHub</button>
  </footer>

</div>

<!-- Modal Configuration GitHub -->
<div id="configModal" class="modal">
  <div class="modal-content">
    <h3>Configuration GitHub</h3>
    <label>Dépôt (ex: gregorryy/horizon)</label>
    <input type="text" id="ghRepo" placeholder="utilisateur/repo">
    <label>Token d'accès personnel (PAT)</label>
    <input type="password" id="ghToken" placeholder="ghp_...">
    <div class="modal-actions">
      <button id="configSave" class="btn btn-primary">Enregistrer</button>
      <button id="configClose" class="btn btn-secondary">Fermer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
